services:
  postgres:
    image: postgres:16-alpine
    container_name: finsignal_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: finsignal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finsignal_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: