services:
  
  postgres:
    image: postgres:15-alpine
    container_name: streamquant_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-streamquant}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finsignal_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-streamquantredispass}
    ports:
      - "127.0.0.1:6379:6379"

  api:
    image: python:3.11-slim
    container_name: streamquant_api
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/streamquant}
      - REDIS_URL=${REDIS_URL:-redis://:streamquantredispass@redis:6379/0}
      - STREAMQUANT_API_KEY=${STREAMQUANT_API_KEY}
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    image: python:3.11-slim
    container_name: streamquant_worker
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/streamquant}
      - REDIS_URL=${REDIS_URL:-redis://:streamquantredispass@redis:6379/0}
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             celery -A backend.worker worker --beat --loglevel=info --concurrency=1"
    depends_on:
      - postgres
      - redis

  frontend:
    image: python:3.11-slim
    container_name: streamquant_frontend
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - STREAMQUANT_API_HOST=http://api:8000
      - STREAMQUANT_API_KEY=${STREAMQUANT_API_KEY}
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0"
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  pgdata:
